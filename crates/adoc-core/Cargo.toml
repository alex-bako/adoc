[package]
name = "adoc-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["embeddings"]
embeddings = ["dep:fastembed", "dep:dirs"]
fastembed-it = ["embeddings"]
test-embedding-provider = []

[dependencies]
base64 = "0.22"
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = { version = "6", optional = true }
fastembed = { version = "6", optional = true }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.1.0"
sha2 = "0.11"
thiserror = "2.0.17"
url = "2"

[dev-dependencies]
jsonschema = "0.49.4"
serial_test = "4"
tempfile = "3"

[[test]]
name = "v1_4_semantic_load"
required-features = ["test-embedding-provider"]
